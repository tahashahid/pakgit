<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7A43"/>
      <stop offset="1" stop-color="#01411C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- background tile (macOS-style rounded square) -->
  <rect x="0" y="0" width="1024" height="1024" rx="226" fill="url(#bg)"/>
  <!-- subtle highlight band -->
  <path d="M0 0h1024v300C780 420 300 400 0 240z" fill="#ffffff" opacity="0.04"/>
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round">
    <!-- trunk -->
    <line x1="352" y1="260" x2="352" y2="764"/>
    <!-- branch: a crescent-like sweep from the bottom commit up to the tip -->
    <path d="M352 764 C352 540 480 350 700 322"/>
  </g>
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- commit nodes -->
    <circle cx="352" cy="252" r="84"/>
    <circle cx="352" cy="772" r="84"/>
    <!-- branch tip as the star -->
    <polygon points="716.0,216.0 740.1,282.8 811.1,285.1 755.0,328.7 774.8,396.9 716.0,357.0 657.2,396.9 677.0,328.7 620.9,285.1 691.9,282.8"/>
  </g>
  <!-- node cores in green so the nodes read as rings, like a commit graph -->
  <circle cx="352" cy="252" r="40" fill="#01411C"/>
  <circle cx="352" cy="772" r="40" fill="#01411C"/>
</svg>
