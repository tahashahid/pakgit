appId: org.pakgit.app
productName: PakGit
directories:
  buildResources: build
  output: dist
icon: build/icon.png
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
publish:
  provider: github
  owner: tahashahid
  repo: pakgit
  releaseType: draft
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
win:
  target: [nsis, portable]
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb, rpm]
  category: Development
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # deb and rpm need a maintainer; the GitHub no-reply address keeps the real e-mail out of the packages
  maintainer: Taha Shahid <tahashahid@users.noreply.github.com>
  synopsis: Cross-platform Git client with organization-wide release planning
  description: PakGit is a free Git client for Windows, macOS and Linux with release planning across repositories, Linear and Jira integration and GitHub pull requests.
